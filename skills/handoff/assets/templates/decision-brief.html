<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Decision brief</title>
<style>
/*@@BASE_CSS_START*/
/* shared base: one visual language for all handoff templates */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e9edf4; --ink:#161c29; --ink-2:#434d63; --muted:#667188;
  --line:#d3d9e4; --line-2:#e4e8f0;
  --accent:#1c5cab; --accent-ink:#ffffff; --accent-soft:#dde9f8;
  --good:#17704a; --good-soft:#dcf1e6; --warn:#8f5200; --warn-soft:#fbebcb; --bad:#a93226; --bad-soft:#f8dfda;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#181e29; --surface-2:#222a38; --ink:#e7eaf1; --ink-2:#b4bccd; --muted:#8c97ad;
  --line:#313b4d; --line-2:#262e3c;
  --accent:#7db4ec; --accent-ink:#0b1626; --accent-soft:#1d2d44;
  --good:#5cc79a; --good-soft:#15332a; --warn:#e8b25a; --warn-soft:#3a2d12; --bad:#f0907f; --bad-soft:#3d1f1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#181e29; --surface-2:#222a38; --ink:#e7eaf1; --ink-2:#b4bccd; --muted:#8c97ad;
  --line:#313b4d; --line-2:#262e3c;
  --accent:#7db4ec; --accent-ink:#0b1626; --accent-soft:#1d2d44;
  --good:#5cc79a; --good-soft:#15332a; --warn:#e8b25a; --warn-soft:#3a2d12; --bad:#f0907f; --bad-soft:#3d1f1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow-x:hidden}
.page{max-width:1120px;margin:0 auto;padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--surface-2);padding:.05em .35em;border-radius:4px}
strong.term{font-weight:650;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}

/* header */
.hd{display:grid;gap:18px 32px;grid-template-columns:minmax(0,1fr);padding-bottom:20px;border-bottom:1px solid var(--line)}
.hd-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd h1{font:600 clamp(1.5rem,4.2vw,2.1rem)/1.15 var(--serif);letter-spacing:-.01em}
.bottom{font:400 clamp(1.05rem,2.6vw,1.3rem)/1.4 var(--serif);color:var(--ink);max-width:62ch;margin-top:10px}
.ask{margin-top:14px;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;max-width:62ch;color:var(--ink)}
.ask b{font-weight:650}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:.85rem;align-content:start}
.meta dt{color:var(--muted)} .meta dd{margin:0;overflow-wrap:anywhere}
.meta .src{font-family:var(--mono);font-size:.82em}
@media (min-width:820px){.hd{grid-template-columns:minmax(0,1fr) 270px}.hd-top{grid-column:1/-1}}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;min-height:34px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.82rem;line-height:1.5;color:var(--ink-2)}
button.chip{cursor:pointer;min-height:30px}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.mono{font-family:var(--mono);font-size:.78rem}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:.75rem;font-weight:600;line-height:1.6;background:var(--surface-2);color:var(--ink-2)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search],input[type=text],textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;min-height:34px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* answer block */
.answer{margin-top:28px;padding:16px;display:grid;gap:10px}
.answer h2{font:600 1.1rem var(--serif)}
.answer p{color:var(--ink-2);font-size:.9rem}
.answer textarea{width:100%;font:.84rem/1.5 var(--mono);resize:vertical;min-height:120px;background:var(--bg)}

/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:5px;font-size:.8rem;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.25)}

/* error */
.fail{margin:24px 0;padding:16px;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:var(--r)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface-2:#eef0f4;--ink:#111;--ink-2:#333;--muted:#555;--line:#bbb;--line-2:#ddd;
    --accent:#1c5cab;--accent-ink:#fff;--accent-soft:#e6eefa;--good:#17704a;--good-soft:#e3f3ea;--warn:#8f5200;--warn-soft:#fbeed4;--bad:#a93226;--bad-soft:#f9e4e0;color-scheme:light}
  body{font-size:11pt}.page{max-width:none;padding-block:0}
  .noprint,.btn,.answer textarea{display:none!important}
  .answer{break-inside:avoid}
}
/*@@BASE_CSS_END*/
/* decision-brief */
.list{display:grid;gap:18px;margin-top:24px}
.dec{padding:18px;display:grid;gap:12px;scroll-margin-top:12px}
.dec.done{border-color:var(--accent)}
.dec-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dec-head .state{margin-left:auto;font-size:.82rem;color:var(--muted)}
.dec.done .state{color:var(--accent);font-weight:600}
.q{font:600 clamp(1.1rem,2.8vw,1.35rem)/1.3 var(--serif)}
.ctx{color:var(--ink-2);max-width:66ch}
.affects{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opt{display:grid;gap:8px;align-content:start;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;position:relative}
.opt:hover{border-color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt-head{display:flex;gap:8px;align-items:flex-start}
.opt-head input{margin:4px 0 0;accent-color:var(--accent);flex:none;width:16px;height:16px}
.opt-label{font-weight:650;line-height:1.3;flex:1;min-width:0}
.opt-sum{color:var(--ink-2);font-size:.9rem}
.pc{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:.88rem}
.pc li{display:grid;grid-template-columns:1.1em minmax(0,1fr);gap:4px}
.pc .p::before{content:"+";color:var(--good);font-weight:700}
.pc .c::before{content:"\2212";color:var(--bad);font-weight:700}
.rec{font-size:.9rem;color:var(--ink-2);max-width:70ch}
.rec b{color:var(--accent)}
.note{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note input{flex:1 1 220px;min-width:0}
.bar{position:sticky;bottom:0;z-index:5;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.dots{display:flex;gap:6px;align-items:center;overflow-x:auto;max-width:100%;padding:2px}
.dot{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);color:var(--ink-2);font:600 .72rem var(--mono);text-decoration:none;padding:0 4px}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prog{font-size:.88rem;color:var(--ink-2)}
@media print{.bar{display:none}.opt{break-inside:avoid}.dec{break-inside:avoid}}
</style>
</head>
<body>
<main class="page" id="app"></main>
<script type="application/json" id="handoff-data">{"title":"Sample brief","date":"2026-01-01","source":"sample","bottom_line":"One decision is open.","decisions":[{"id":"D1","question":"Which option?","context":"Sample context.","options":[{"id":"a","label":"Option A","pros":["Simple"],"cons":["Limited"]},{"id":"b","label":"Option B","pros":["Flexible"],"cons":["Costly"]}]}]}</script>
<script>
/*@@BASE_JS_START*/
/* shared base: helpers used by every handoff template */
const HF = (() => {
  const SVGNS = "http://www.w3.org/2000/svg";
  const PROPS = ["checked", "value", "disabled", "selected"];
  function apply(el, a) {
    if (!a) return el;
    for (const [k, v] of Object.entries(a)) {
      if (v == null || v === false) continue;
      if (k === "class") el.setAttribute("class", v);
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (PROPS.includes(k)) el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    return el;
  }
  function add(el, kids) {
    for (const c of kids) {
      if (c == null || c === false) continue;
      if (Array.isArray(c)) add(el, c);
      else el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const h = (tag, a, ...kids) => add(apply(document.createElement(tag), a), kids);
  const s = (tag, a, ...kids) => add(apply(document.createElementNS(SVGNS, tag), a), kids);
  const $ = (sel, root = document) => root.querySelector(sel);
  const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

  /* inline markup: **term** and `code`; data is never parsed as HTML */
  function md(text) {
    return String(text ?? "").split(/(\*\*[^*]+\*\*|`[^`]+`)/).filter(Boolean).map((p) =>
      p.startsWith("**") ? h("strong", { class: "term" }, p.slice(2, -2))
      : p.startsWith("`") ? h("code", null, p.slice(1, -1)) : p);
  }

  const THEMES = ["auto", "light", "dark"];
  function themeButton() {
    let i = 0;
    const b = h("button", { class: "btn ghost noprint", type: "button" }, "Theme: auto");
    b.addEventListener("click", () => {
      i = (i + 1) % 3;
      const root = document.documentElement;
      if (THEMES[i] === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", THEMES[i]);
      b.textContent = "Theme: " + THEMES[i];
    });
    return b;
  }

  function header(d, kind, defaultAsk) {
    const dl = h("dl", { class: "meta" },
      h("dt", null, "Date"), h("dd", { class: "num" }, d.date),
      h("dt", null, "Source"), h("dd", { class: "src" }, d.source),
      h("dt", null, "Format"), h("dd", null, kind));
    return h("header", { class: "hd" },
      h("div", { class: "hd-top" }, h("span", { class: "chip" }, kind), themeButton()),
      h("div", null,
        h("h1", null, d.title),
        h("p", { class: "bottom" }, md(d.bottom_line)),
        h("p", { class: "ask" }, h("b", null, "Your move. "), md(d.ask || defaultAsk))),
      dl);
  }

  /* one copyable answer block per page; copyBtn() makes extra buttons wired to the same text */
  function answerBlock(heading, hint) {
    const ta = h("textarea", { readonly: true, rows: 6, "aria-label": heading, id: "answer-text" });
    const note = h("span", { class: "sr", role: "status", "aria-live": "polite" });
    const copyBtn = () => {
      const btn = h("button", { class: "btn pri copy-btn", type: "button" }, "Copy answers");
      btn.addEventListener("click", async () => {
        let ok = false;
        try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {
          ta.focus(); ta.select();
          try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
        }
        btn.textContent = ok ? "Copied" : "Selected, press Ctrl/Cmd+C";
        note.textContent = btn.textContent;
        setTimeout(() => { btn.textContent = "Copy answers"; }, 2200);
      });
      return btn;
    };
    const el = h("section", { class: "answer panel", "aria-labelledby": "answer-h" },
      h("h2", { id: "answer-h" }, heading), h("p", null, hint), ta, h("div", { class: "row" }, copyBtn(), note));
    return { el, copyBtn, set(text) { ta.value = text; ta.rows = Math.min(18, Math.max(5, text.split("\n").length + 1)); } };
  }

  /* hover and focus tooltip */
  let tipEl = null;
  function tip(el, textFn) {
    const show = (e) => {
      if (!tipEl) { tipEl = h("div", { class: "tip", role: "tooltip" }); document.body.append(tipEl); }
      tipEl.textContent = typeof textFn === "function" ? textFn() : textFn;
      tipEl.hidden = false;
      const r = e.type === "focus" ? el.getBoundingClientRect() : { left: e.clientX, bottom: e.clientY + 10, top: e.clientY };
      const w = tipEl.offsetWidth, x = Math.min(Math.max(8, r.left + 8), window.innerWidth - w - 8);
      tipEl.style.left = x + "px"; tipEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 40) + "px";
    };
    const hide = () => { if (tipEl) tipEl.hidden = true; };
    el.addEventListener("mousemove", show); el.addEventListener("mouseenter", show);
    el.addEventListener("mouseleave", hide); el.addEventListener("focus", show); el.addEventListener("blur", hide);
  }

  function boot(render) {
    const root = document.getElementById("app");
    try {
      const data = JSON.parse(document.getElementById("handoff-data").textContent);
      document.title = data.title || document.title;
      render(root, data);
    } catch (err) {
      clear(root).append(h("div", { class: "fail", role: "alert" }, "This page could not render its data: " + err.message));
      console.error(err);
    }
  }
  return { h, s, $, clear, md, header, answerBlock, tip, boot };
})();
/*@@BASE_JS_END*/
HF.boot((root, d) => {
  const { h } = HF;
  const state = Object.fromEntries(d.decisions.map((x) => [x.id, { choice: null, note: "" }]));
  const dots = {}, cards = {}, states = {};
  const ans = HF.answerBlock("Answer block", "Paste this into the chat. Decisions without a choice are listed as open.");
  const prog = h("span", { class: "prog", role: "status", "aria-live": "polite" });

  function text() {
    const done = d.decisions.filter((x) => state[x.id].choice);
    const open = d.decisions.filter((x) => !state[x.id].choice);
    const lines = ["Answers: " + d.title + " (" + d.date + ")"];
    for (const x of d.decisions) {
      const st = state[x.id], o = x.options.find((y) => y.id === st.choice);
      lines.push(x.id + ": " + (o ? "chose " + o.id + " (" + o.label + ")" : "open") + (st.note.trim() ? ". Note: " + st.note.trim() : ""));
    }
    lines.push("Decided " + done.length + " of " + d.decisions.length + (open.length ? "; open: " + open.map((x) => x.id).join(", ") : ""));
    return lines.join("\n");
  }
  function refresh() {
    let n = 0;
    for (const x of d.decisions) {
      const on = !!state[x.id].choice; if (on) n++;
      dots[x.id].classList.toggle("on", on);
      cards[x.id].classList.toggle("done", on);
      states[x.id].textContent = on ? "Decided" : "Open";
    }
    prog.textContent = n + " of " + d.decisions.length + " decided";
    ans.set(text());
  }

  function option(x, o) {
    const input = h("input", { type: "radio", name: "r-" + x.id, id: "r-" + x.id + "-" + o.id, value: o.id,
      onchange: () => { state[x.id].choice = o.id; refresh(); } });
    return h("label", { class: "opt", for: input.id },
      h("div", { class: "opt-head" }, input, h("span", { class: "opt-label" }, o.label),
        x.recommended === o.id ? h("span", { class: "tag info" }, "Recommended") : null),
      o.summary ? h("p", { class: "opt-sum" }, HF.md(o.summary)) : null,
      h("ul", { class: "pc" },
        (o.pros || []).map((t) => h("li", { class: "p" }, h("span", null, HF.md(t)))),
        (o.cons || []).map((t) => h("li", { class: "c" }, h("span", null, HF.md(t))))));
  }

  function card(x) {
    const rec = x.options.find((o) => o.id === x.recommended);
    const note = h("input", { type: "text", id: "n-" + x.id, placeholder: "Optional note for " + x.id, "aria-label": "Note for " + x.id,
      oninput: (e) => { state[x.id].note = e.target.value; ans.set(text()); } });
    const clear = h("button", { class: "btn ghost", type: "button", onclick: () => {
      state[x.id].choice = null; cards[x.id].querySelectorAll("input[type=radio]").forEach((r) => { r.checked = false; }); refresh(); } }, "Clear choice");
    states[x.id] = h("span", { class: "state" }, "Open");
    cards[x.id] = h("section", { class: "dec panel", id: "d-" + x.id, "aria-labelledby": "q-" + x.id },
      h("div", { class: "dec-head" }, h("span", { class: "chip mono" }, x.id), x.tag ? h("span", { class: "tag " + (x.tag === "blocking" ? "bad" : "warn") }, x.tag) : null, states[x.id]),
      h("h2", { class: "q", id: "q-" + x.id }, HF.md(x.question)),
      h("p", { class: "ctx" }, HF.md(x.context)),
      x.affects && x.affects.length ? h("div", { class: "affects" }, "Affects", x.affects.map((a) => h("span", { class: "chip mono" }, a))) : null,
      h("div", { class: "opts", role: "radiogroup", "aria-labelledby": "q-" + x.id }, x.options.map((o) => option(x, o))),
      rec ? h("p", { class: "rec" }, h("b", null, "Recommended: " + rec.label + ". "), HF.md(x.reason)) : null,
      h("div", { class: "note" }, note, clear));
    return cards[x.id];
  }

  const bar = h("nav", { class: "bar noprint", "aria-label": "Progress" },
    h("div", { class: "dots" }, d.decisions.map((x) => {
      dots[x.id] = h("a", { class: "dot", href: "#d-" + x.id, title: x.question }, x.id.replace(/^\D+/, "") || x.id);
      return dots[x.id];
    })), h("div", { class: "row", style: "margin-left:auto" }, prog, ans.copyBtn()));
  root.append(HF.header(d, "Decision brief", "Pick one option per decision, add a note where it helps, then copy the answers into the chat."),
    h("div", { class: "list" }, d.decisions.map(card)), bar, ans.el);
  refresh();
});
</script>
</body>
</html>
