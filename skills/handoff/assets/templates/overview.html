<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Overview</title>
<style>
/*@@BASE_CSS_START*/
/* shared base: one visual language for all handoff templates */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e9edf4; --ink:#161c29; --ink-2:#434d63; --muted:#667188;
  --line:#d3d9e4; --line-2:#e4e8f0;
  --accent:#1c5cab; --accent-ink:#ffffff; --accent-soft:#dde9f8;
  --good:#17704a; --good-soft:#dcf1e6; --warn:#8f5200; --warn-soft:#fbebcb; --bad:#a93226; --bad-soft:#f8dfda;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#181e29; --surface-2:#222a38; --ink:#e7eaf1; --ink-2:#b4bccd; --muted:#8c97ad;
  --line:#313b4d; --line-2:#262e3c;
  --accent:#7db4ec; --accent-ink:#0b1626; --accent-soft:#1d2d44;
  --good:#5cc79a; --good-soft:#15332a; --warn:#e8b25a; --warn-soft:#3a2d12; --bad:#f0907f; --bad-soft:#3d1f1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#181e29; --surface-2:#222a38; --ink:#e7eaf1; --ink-2:#b4bccd; --muted:#8c97ad;
  --line:#313b4d; --line-2:#262e3c;
  --accent:#7db4ec; --accent-ink:#0b1626; --accent-soft:#1d2d44;
  --good:#5cc79a; --good-soft:#15332a; --warn:#e8b25a; --warn-soft:#3a2d12; --bad:#f0907f; --bad-soft:#3d1f1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow-x:hidden}
.page{max-width:1120px;margin:0 auto;padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--surface-2);padding:.05em .35em;border-radius:4px}
strong.term{font-weight:650;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}

/* header */
.hd{display:grid;gap:18px 32px;grid-template-columns:minmax(0,1fr);padding-bottom:20px;border-bottom:1px solid var(--line)}
.hd-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd h1{font:600 clamp(1.5rem,4.2vw,2.1rem)/1.15 var(--serif);letter-spacing:-.01em}
.bottom{font:400 clamp(1.05rem,2.6vw,1.3rem)/1.4 var(--serif);color:var(--ink);max-width:62ch;margin-top:10px}
.ask{margin-top:14px;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;max-width:62ch;color:var(--ink)}
.ask b{font-weight:650}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:.85rem;align-content:start}
.meta dt{color:var(--muted)} .meta dd{margin:0;overflow-wrap:anywhere}
.meta .src{font-family:var(--mono);font-size:.82em}
@media (min-width:820px){.hd{grid-template-columns:minmax(0,1fr) 270px}.hd-top{grid-column:1/-1}}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;min-height:34px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.82rem;line-height:1.5;color:var(--ink-2)}
button.chip{cursor:pointer;min-height:30px}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.mono{font-family:var(--mono);font-size:.78rem}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:.75rem;font-weight:600;line-height:1.6;background:var(--surface-2);color:var(--ink-2)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search],input[type=text],textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;min-height:34px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* answer block */
.answer{margin-top:28px;padding:16px;display:grid;gap:10px}
.answer h2{font:600 1.1rem var(--serif)}
.answer p{color:var(--ink-2);font-size:.9rem}
.answer textarea{width:100%;font:.84rem/1.5 var(--mono);resize:vertical;min-height:120px;background:var(--bg)}

/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:5px;font-size:.8rem;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.25)}

/* error */
.fail{margin:24px 0;padding:16px;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:var(--r)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface-2:#eef0f4;--ink:#111;--ink-2:#333;--muted:#555;--line:#bbb;--line-2:#ddd;
    --accent:#1c5cab;--accent-ink:#fff;--accent-soft:#e6eefa;--good:#17704a;--good-soft:#e3f3ea;--warn:#8f5200;--warn-soft:#fbeed4;--bad:#a93226;--bad-soft:#f9e4e0;color-scheme:light}
  body{font-size:11pt}.page{max-width:none;padding-block:0}
  .noprint,.btn,.answer textarea{display:none!important}
  .answer{break-inside:avoid}
}
/*@@BASE_CSS_END*/
:root{--k-added:var(--good);--k-changed:var(--s1);--k-removed:var(--bad);--k-reversed:var(--warn);--k-conflict:var(--ink)}
.cp{margin-top:18px;color:var(--ink-2);font-size:.9rem}
.cp b{color:var(--ink)}
.kd{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font:700 .8rem/1 var(--mono);color:var(--bg)}
.k-added .kd,.kd.k-added{background:var(--k-added)}.k-changed .kd,.kd.k-changed{background:var(--k-changed);color:#fff}
.k-removed .kd,.kd.k-removed{background:var(--k-removed)}.k-reversed .kd,.kd.k-reversed{background:var(--k-reversed)}
.k-conflict .kd,.kd.k-conflict{background:var(--k-conflict)}
.kd.k-added,.kd.k-removed,.kd.k-reversed{color:var(--surface)}
.grp{margin-top:18px;padding:0}
.grp>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 16px;font:600 1.05rem var(--serif)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"\25B8";color:var(--muted);font-size:.9em;transition:transform .15s}
.grp[open]>summary::before{transform:rotate(90deg)}
.grp>summary .cnt{margin-left:auto;font:400 .82rem var(--sans);color:var(--muted)}
.it{border-top:1px solid var(--line-2)}
.it>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:12px 16px}
.it>summary::-webkit-details-marker{display:none}
.it .ttl{font-weight:600;flex:1 1 240px;min-width:0}
.it.rev .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.kn{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:650;min-width:92px}
.rvw{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;cursor:pointer;padding:4px 6px}
.rvw input{width:16px;height:16px;accent-color:var(--accent)}
.bd{padding:0 16px 16px;display:grid;gap:10px}
.why{color:var(--ink-2);max-width:70ch}
.df{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.df.two{grid-template-columns:1fr 1fr}}
.pn{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:10px 12px;font-size:.92rem;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.pn h4{margin:0 0 4px;font:600 .75rem var(--sans);color:var(--muted)}
.pn del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;border-radius:3px;padding:0 2px}
.pn ins{background:var(--good-soft);color:var(--good);text-decoration:underline;text-underline-offset:2px;font-weight:600;border-radius:3px;padding:0 2px}
.none{padding:24px;color:var(--muted);text-align:center}
.fig{display:grid;gap:8px;min-width:0}
.fig h3{font:600 1rem var(--serif)}
.fig figcaption,.dir{font-size:.85rem;color:var(--muted)}
.fig{margin:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.dt{border-collapse:collapse;width:100%;font-size:.92rem}
.dt th,.dt td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
.dt th{background:var(--surface-2);font-weight:650;white-space:nowrap}
.dt td:first-child{font-weight:650}
.dt td{min-width:110px}
.dt tr:last-child td{border-bottom:0}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.lg span{display:inline-flex;gap:6px;align-items:center}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
svg.ch{display:block;width:100%;height:auto;overflow:visible}
.ch text{fill:var(--ink-2);font:12px var(--sans)}.ch .v{fill:var(--ink);font:600 12px var(--sans)}
.ch .grid{stroke:var(--line-2);stroke-width:1}.ch .axis{stroke:var(--muted);stroke-width:1}
.lst{margin:0;padding-left:1.3em;display:grid;gap:6px;max-width:66ch}
/* overview */
.task{margin-top:18px;color:var(--ink-2);max-width:70ch}.task b{color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ov{margin-top:32px;display:grid;gap:12px;min-width:0;scroll-margin-top:12px}
.ov>h2{font:600 clamp(1.25rem,3vw,1.55rem)/1.2 var(--serif);display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap}
.ov>h2 .cnt{font:400 .85rem var(--sans);color:var(--muted)}
.ov .grp,.ov .cp{margin-top:0}
.act{list-style:none;margin:0;padding:0}
.act li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line-2)}
.act li:first-child{border-top:0}
.act input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.act .tag{flex:none;min-width:58px;text-align:center;margin-top:1px}
.act label{flex:1;min-width:0;cursor:pointer}
.act li.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.st{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.sc{padding:10px 14px;display:grid;gap:2px;align-content:start;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.sc .sl{font-size:.82rem;color:var(--muted)}.sc .sv{font:600 1.5rem/1.2 var(--serif)}.sc .sn{font-size:.82rem;color:var(--ink-2)}
.sc.good .sv{color:var(--good)}.sc.warn .sv{color:var(--warn)}.sc.bad .sv{color:var(--bad)}
.res{display:grid;gap:14px;padding:16px;min-width:0}
.res h3{font:600 1.05rem var(--serif)}
.res .sum{color:var(--ink-2);max-width:70ch}
.dq{padding:14px 16px;display:grid;gap:8px;min-width:0}
.dq+.dq{border-top:1px solid var(--line-2)}
.dq .q{display:flex;gap:10px;align-items:baseline}.dq .q b{flex:1;min-width:0;font-weight:650}
.dq .ctx{color:var(--ink-2);font-size:.92rem;max-width:70ch}
.dq label{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:var(--r);cursor:pointer}
.dq label:hover{background:var(--surface-2)}
.dq input{margin-top:4px;accent-color:var(--accent)}
.nx{margin:0;padding:12px 16px 12px 2.6em;display:grid;gap:6px}
@media print{.grp,.it,.res,.dq{break-inside:avoid}.nav{display:none}}
</style>
</head>
<body>
<main class="page" id="app"></main>
<script type="application/json" id="handoff-data">{"title":"Sample overview","date":"2026-01-01","source":"sample","bottom_line":"The task is done.","actions":[{"id":"A1","kind":"review","text":"Check the one change."}],"next_steps":["Nothing further."]}</script>
<script>
/*@@BASE_JS_START*/
/* shared base: helpers used by every handoff template */
const HF = (() => {
  const SVGNS = "http://www.w3.org/2000/svg";
  const PROPS = ["checked", "value", "disabled", "selected"];
  function apply(el, a) {
    if (!a) return el;
    for (const [k, v] of Object.entries(a)) {
      if (v == null || v === false) continue;
      if (k === "class") el.setAttribute("class", v);
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (PROPS.includes(k)) el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    return el;
  }
  function add(el, kids) {
    for (const c of kids) {
      if (c == null || c === false) continue;
      if (Array.isArray(c)) add(el, c);
      else el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const h = (tag, a, ...kids) => add(apply(document.createElement(tag), a), kids);
  const s = (tag, a, ...kids) => add(apply(document.createElementNS(SVGNS, tag), a), kids);
  const $ = (sel, root = document) => root.querySelector(sel);
  const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

  /* inline markup: **term** and `code`; data is never parsed as HTML */
  function md(text) {
    return String(text ?? "").split(/(\*\*[^*]+\*\*|`[^`]+`)/).filter(Boolean).map((p) =>
      p.startsWith("**") ? h("strong", { class: "term" }, p.slice(2, -2))
      : p.startsWith("`") ? h("code", null, p.slice(1, -1)) : p);
  }

  const THEMES = ["auto", "light", "dark"];
  function themeButton() {
    let i = 0;
    const b = h("button", { class: "btn ghost noprint", type: "button" }, "Theme: auto");
    b.addEventListener("click", () => {
      i = (i + 1) % 3;
      const root = document.documentElement;
      if (THEMES[i] === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", THEMES[i]);
      b.textContent = "Theme: " + THEMES[i];
    });
    return b;
  }

  function header(d, kind, defaultAsk) {
    const dl = h("dl", { class: "meta" },
      h("dt", null, "Date"), h("dd", { class: "num" }, d.date),
      h("dt", null, "Source"), h("dd", { class: "src" }, d.source),
      h("dt", null, "Format"), h("dd", null, kind));
    return h("header", { class: "hd" },
      h("div", { class: "hd-top" }, h("span", { class: "chip" }, kind), themeButton()),
      h("div", null,
        h("h1", null, d.title),
        h("p", { class: "bottom" }, md(d.bottom_line)),
        h("p", { class: "ask" }, h("b", null, "Your move. "), md(d.ask || defaultAsk))),
      dl);
  }

  /* one copyable answer block per page; copyBtn() makes extra buttons wired to the same text */
  function answerBlock(heading, hint) {
    const ta = h("textarea", { readonly: true, rows: 6, "aria-label": heading, id: "answer-text" });
    const note = h("span", { class: "sr", role: "status", "aria-live": "polite" });
    const copyBtn = () => {
      const btn = h("button", { class: "btn pri copy-btn", type: "button" }, "Copy answers");
      btn.addEventListener("click", async () => {
        let ok = false;
        try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {
          ta.focus(); ta.select();
          try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
        }
        btn.textContent = ok ? "Copied" : "Selected, press Ctrl/Cmd+C";
        note.textContent = btn.textContent;
        setTimeout(() => { btn.textContent = "Copy answers"; }, 2200);
      });
      return btn;
    };
    const el = h("section", { class: "answer panel", "aria-labelledby": "answer-h" },
      h("h2", { id: "answer-h" }, heading), h("p", null, hint), ta, h("div", { class: "row" }, copyBtn(), note));
    return { el, copyBtn, set(text) { ta.value = text; ta.rows = Math.min(18, Math.max(5, text.split("\n").length + 1)); } };
  }

  /* hover and focus tooltip */
  let tipEl = null;
  function tip(el, textFn) {
    const show = (e) => {
      if (!tipEl) { tipEl = h("div", { class: "tip", role: "tooltip" }); document.body.append(tipEl); }
      tipEl.textContent = typeof textFn === "function" ? textFn() : textFn;
      tipEl.hidden = false;
      const r = e.type === "focus" ? el.getBoundingClientRect() : { left: e.clientX, bottom: e.clientY + 10, top: e.clientY };
      const w = tipEl.offsetWidth, x = Math.min(Math.max(8, r.left + 8), window.innerWidth - w - 8);
      tipEl.style.left = x + "px"; tipEl.style.top = Math.min(r.bottom + 6, window.innerHeight - 40) + "px";
    };
    const hide = () => { if (tipEl) tipEl.hidden = true; };
    el.addEventListener("mousemove", show); el.addEventListener("mouseenter", show);
    el.addEventListener("mouseleave", hide); el.addEventListener("focus", show); el.addEventListener("blur", hide);
  }

  function boot(render) {
    const root = document.getElementById("app");
    try {
      const data = JSON.parse(document.getElementById("handoff-data").textContent);
      document.title = data.title || document.title;
      render(root, data);
    } catch (err) {
      clear(root).append(h("div", { class: "fail", role: "alert" }, "This page could not render its data: " + err.message));
      console.error(err);
    }
  }
  return { h, s, $, clear, md, header, answerBlock, tip, boot };
})();
/*@@BASE_JS_END*/
HF.boot((root, d) => {
  const { h, s } = HF;
  const KINDS = { added: ["+", "Added"], changed: ["~", "Changed"], removed: ["−", "Removed"], reversed: ["⇄", "Reversed"], conflict: ["!", "Conflict"] };
  const ACT = { decide: ["Decide", "warn"], review: ["Review", "info"], do: ["Do", ""] };
  const done = new Set(), rev = new Set(), picks = {}, charts = [];
  const ch = d.changes, items = ch ? ch.items : [], decs = d.decisions || [];
  const ans = HF.answerBlock("Answer block", "Paste this into the chat to report what you did, reviewed and decided.");

  /* word-level diff: LCS over words, punctuation split off */
  const toks = (t) => [...String(t).matchAll(/(\s*)([\w'’\-\/]+|[^\w\s])/g)].map((m) => ({ w: m[2], sp: m[1].length > 0 }));
  function diff(a, b) {
    const A = toks(a), B = toks(b), n = A.length, m = B.length;
    const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i].w === B[j].w ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    let i = 0, j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && A[i].w === B[j].w) { A[i].op = B[j].op = "="; i++; j++; }
      else if (j >= m || (i < n && L[i + 1][j] >= L[i][j + 1])) A[i++].op = "-"; else B[j++].op = "+";
    }
    return [A, B];
  }
  function render(tokens, mark) {
    const out = []; let run = null;
    const flush = () => { if (run) { out.push(h(mark === "-" ? "del" : "ins", null, run.txt)); run = null; } };
    tokens.forEach((t, k) => {
      const sp = k > 0 && t.sp ? " " : "";
      if (t.op === mark) { if (run) run.txt += sp + t.w; else { if (sp) out.push(sp); run = { txt: t.w }; } }
      else { flush(); out.push(sp + t.w); }
    });
    flush(); return out;
  }
  const pane = (label, content) => h("div", { class: "pn" }, h("h4", null, label), h("div", null, content));

  function body(x) {
    const bl = x.before_label || "Before", al = x.after_label || "After";
    let panes;
    if (x.before != null && x.after != null) { const [A, B] = diff(x.before, x.after); panes = [pane(bl, render(A, "-")), pane(al, render(B, "+"))]; }
    else if (x.after != null) panes = [pane(al, x.after)]; else panes = [pane(bl, x.before)];
    return h("div", { class: "bd" }, x.why ? h("p", { class: "why" }, HF.md(x.why)) : null, h("div", { class: "df" + (panes.length > 1 ? " two" : "") }, panes));
  }


  /* ---- charts ---- */
  const niceStep = (x) => { const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
  const fmt = (v, u) => (Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100)) + (u ? " " + u : "");
  const cut = (t, n) => (t.length > n ? t.slice(0, Math.max(1, n - 1)) + "…" : t);
  function drawChart(host, c, W) {
    const S = c.series, all = S.flatMap((x) => x.values), col = (i) => `var(--s${i + 1})`;
    const lab = c.kind === "bar" ? Math.min(170, Math.max(60, Math.max(...c.labels.map((x) => x.length)) * 6.6)) : 0;
    let svg, H;
    if (c.kind === "bar") {
      const bh = 14, rowH = S.length * (bh + 2) + 12, t = 6, b = 24, l = Math.min(lab, W * 0.4), r = 50, pw = W - l - r;
      const step = niceStep(Math.max(...all) / 4), max = Math.ceil(Math.max(...all) / step) * step; H = t + c.labels.length * rowH + b;
      svg = s("svg", { class: "ch", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": c.title || "Bar chart" });
      for (let v = 0; v <= max + 1e-9; v += step) { const x = l + pw * v / max;
        svg.append(s("line", { class: v ? "grid" : "axis", x1: x, x2: x, y1: t, y2: H - b }), s("text", { x, y: H - 8, "text-anchor": "middle" }, fmt(v))); }
      c.labels.forEach((lb, i) => { const y0 = t + i * rowH + 4;
        svg.append(s("text", { x: l - 8, y: y0 + (S.length * (bh + 2)) / 2 + 3, "text-anchor": "end" }, cut(lb, Math.floor(l / 6.4))));
        S.forEach((x, k) => { const v = x.values[i], w = Math.max(v > 0 ? 2 : 0, pw * v / max), y = y0 + k * (bh + 2);
          const g = s("g", { tabindex: 0, "aria-label": `${lb}, ${x.name}: ${fmt(v, c.unit)}` }, s("rect", { x: l, y, width: w, height: bh, rx: 2, fill: col(k) }),
            s("text", { class: "v", x: l + w + 5, y: y + bh - 3 }, fmt(v)));
          HF.tip(g, () => `${lb}${S.length > 1 ? ", " + x.name : ""}: ${fmt(v, c.unit)}`); svg.append(g); }); });
    } else {
      const l = 40, r = S.length > 1 ? 74 : 20, t = 12, b = 30, pw = W - l - r, ph = 190; H = t + ph + b;
      const lo = Math.min(...all) >= 0 ? 0 : Math.floor(Math.min(...all)), step = niceStep((Math.max(...all) - lo) / 4 || 1), max = lo + Math.ceil((Math.max(...all) - lo) / step) * step;
      const X = (i) => l + pw * i / (c.labels.length - 1), Y = (v) => t + ph - ph * (v - lo) / (max - lo);
      svg = s("svg", { class: "ch", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": c.title || "Line chart" });
      for (let v = lo; v <= max + 1e-9; v += step) svg.append(s("line", { class: v === lo ? "axis" : "grid", x1: l, x2: l + pw, y1: Y(v), y2: Y(v) }), s("text", { x: l - 8, y: Y(v) + 4, "text-anchor": "end" }, fmt(v)));
      const skip = Math.ceil(c.labels.length * 56 / pw);
      c.labels.forEach((lb, i) => { if (i % skip === 0) svg.append(s("text", { x: X(i), y: H - 8, "text-anchor": "middle" }, cut(lb, Math.max(4, Math.floor(pw / c.labels.length * skip / 6.4))))); });
      S.forEach((x, k) => { svg.append(s("path", { d: x.values.map((v, i) => (i ? "L" : "M") + X(i) + " " + Y(v)).join(""), fill: "none", stroke: col(k), "stroke-width": 2 }));
        x.values.forEach((v, i) => { const g = s("g", { tabindex: 0, "aria-label": `${c.labels[i]}, ${x.name}: ${fmt(v, c.unit)}` },
          s("circle", { cx: X(i), cy: Y(v), r: 4, fill: col(k), stroke: "var(--bg)", "stroke-width": 2 })); HF.tip(g, () => `${c.labels[i]}${S.length > 1 ? ", " + x.name : ""}: ${fmt(v, c.unit)}`); svg.append(g); });
        if (S.length > 1) svg.append(s("text", { x: X(x.values.length - 1) + 9, y: Y(x.values[x.values.length - 1]) + 4 }, cut(x.name, 10))); });
    }
    HF.clear(host).append(svg);
  }
  function chartBlock(c) {
    const host = h("div"); charts.push({ host, c });
    return h("figure", { class: "fig" }, c.title ? h("h3", null, c.title) : null,
      c.series.length > 1 ? h("div", { class: "lg" }, c.series.map((x, i) => h("span", null, h("i", { style: `background:var(--s${i + 1})` }), x.name))) : null,
      host, c.caption ? h("figcaption", null, c.caption) : null);
  }
  const redraw = () => { const W = Math.min(720, Math.max(260, root.clientWidth - 68)); charts.forEach(({ host, c }) => drawChart(host, c, W)); };
  const blocks = {
    stats: (b) => h("div", { class: "st" }, b.items.map((x) => h("div", { class: "sc" + (x.tone ? " " + x.tone : "") },
      h("span", { class: "sl" }, x.label), h("b", { class: "sv num" }, x.value), x.note ? h("span", { class: "sn" }, HF.md(x.note)) : null))),
    table: (b) => h("figure", { class: "fig" }, h("div", { class: "tw" }, h("table", { class: "dt" }, h("thead", null, h("tr", null, b.columns.map((x) => h("th", null, x)))),
      h("tbody", null, b.rows.map((r) => h("tr", null, r.map((x) => h("td", null, HF.md(x)))))))), b.caption ? h("figcaption", null, b.caption) : null),
    chart: chartBlock,
    list: (b) => h("div", { class: "fig" }, b.title ? h("h3", null, b.title) : null, h(b.ordered ? "ol" : "ul", { class: "lst" }, b.items.map((x) => h("li", null, HF.md(x))))),
  };

  const cnt = () => h("span", { class: "cnt", role: "status", "aria-live": "polite" });
  const actCnt = cnt(), chgCnt = cnt(), decCnt = cnt();
  const sec = (id, title, count, ...kids) => h("section", { class: "ov", id: "sec-" + id, "data-title": title, "aria-labelledby": "h-" + id },
    h("h2", { id: "h-" + id }, title, count), kids);

  function action(a) {
    const [name, tone] = ACT[a.kind];
    const cb = h("input", { type: "checkbox", id: "a-" + a.id, onchange: (e) => { e.target.checked ? done.add(a.id) : done.delete(a.id); li.classList.toggle("done", e.target.checked); update(); } });
    const li = h("li", null, cb, h("span", { class: "tag " + tone }, name), h("label", { for: cb.id }, HF.md(a.text), a.ref ? [" ", h("span", { class: "chip mono" }, a.ref)] : null));
    return li;
  }

  function item(x) {
    const cb = h("input", { type: "checkbox", id: "rv-" + x.id, "aria-label": "Mark " + x.id + " as reviewed", onchange: (e) => {
      e.target.checked ? rev.add(x.id) : rev.delete(x.id); el.classList.toggle("rev", e.target.checked); if (e.target.checked) el.open = false; update(); } });
    cb.addEventListener("click", (e) => e.stopPropagation());
    const lab = h("label", { class: "rvw", for: cb.id }, cb, "Reviewed");
    lab.addEventListener("click", (e) => e.stopPropagation());
    const [g, name] = KINDS[x.kind];
    const el = h("details", { class: "it k-" + x.kind, open: !!x.review, id: "i-" + x.id },
      h("summary", null, h("span", { class: "kn" }, h("span", { class: "kd k-" + x.kind, "aria-hidden": "true" }, g), name),
        h("span", { class: "ttl" }, x.title), x.ref ? h("span", { class: "chip mono" }, x.ref) : null,
        x.review ? h("span", { class: "tag warn" }, "Needs review") : null, lab),
      body(x));
    return el;
  }
  function group(a) {
    const its = items.filter((x) => x.area === a.id);
    return its.length ? h("details", { class: "grp panel", open: true }, h("summary", null, a.label, h("span", { class: "cnt" }, its.length + (its.length === 1 ? " change" : " changes"))), its.map(item)) : null;
  }

  const result = (r) => h("div", { class: "res panel", id: "r-" + r.id }, h("h3", null, r.heading), r.summary ? h("p", { class: "sum" }, HF.md(r.summary)) : null, (r.blocks || []).map((b) => blocks[b.type](b)));

  function decision(q) {
    const opts = (q.options || []).map((o, k) => h("label", null, h("input", { type: "radio", name: "d-" + q.id, value: k, onchange: () => { picks[q.id] = o; update(); } }),
      h("span", null, HF.md(o), q.recommended === k ? [" ", h("span", { class: "tag good" }, "Recommended")] : null)));
    return h("div", { class: "dq", role: "group", "aria-labelledby": "dq-" + q.id }, h("div", { class: "q" }, h("span", { class: "chip mono" }, q.id), h("b", { id: "dq-" + q.id }, HF.md(q.question))),
      q.context ? h("p", { class: "ctx" }, HF.md(q.context)) : null, opts.length ? h("div", { role: "radiogroup", "aria-labelledby": "dq-" + q.id }, opts) : h("p", { class: "ctx" }, "Open question: answer it in the chat."));
  }

  function text() {
    const L = ["Overview: " + d.title + " (" + d.date + ")"];
    if (d.actions.length) { L.push("Actions done: " + done.size + " of " + d.actions.length); d.actions.forEach((a) => L.push("- [" + (done.has(a.id) ? "x" : " ") + "] " + a.id + " " + a.text)); }
    if (items.length) { const o = items.filter((x) => !rev.has(x.id)); L.push("Changes reviewed: " + rev.size + " of " + items.length + (o.length ? "; still open: " + o.map((x) => x.id).join(", ") : "")); }
    if (decs.length) { L.push("Decisions:"); decs.forEach((q) => L.push("- " + q.id + ": " + (picks[q.id] != null ? picks[q.id] : "(no answer yet)"))); }
    return L.join("\n");
  }
  function update() {
    actCnt.textContent = d.actions.length ? done.size + " of " + d.actions.length + " done" : "";
    chgCnt.textContent = items.length ? rev.size + " of " + items.length + " reviewed" : "";
    decCnt.textContent = decs.length ? decs.filter((q) => picks[q.id] != null).length + " of " + decs.length + " answered" : "";
    ans.set(text());
  }

  const parts = [sec("act", "Required from you", actCnt, d.actions.length ? h("ul", { class: "act panel" }, d.actions.map(action)) : h("p", { class: "none panel" }, "Nothing is required from you."))];
  if (ch) parts.push(sec("chg", "What changed", chgCnt, h("p", { class: "cp" }, "Since ", h("b", null, ch.checkpoint), ". Items flagged for review are open."), ch.areas.map(group)));
  if (d.results) parts.push(sec("res", "Results", null, d.results.map(result)));
  if (decs.length) parts.push(sec("dec", "Open decisions", decCnt, h("div", { class: "panel" }, decs.map(decision))));
  if (d.next_steps) parts.push(sec("nxt", "Next steps", null, h("ol", { class: "nx panel" }, d.next_steps.map((x) => h("li", null, HF.md(x))))));
  const nav = h("nav", { class: "nav noprint", "aria-label": "Sections" }, parts.map((p) => h("button", { class: "chip", type: "button", onclick: () => p.scrollIntoView({ behavior: "smooth", block: "start" }) }, p.getAttribute("data-title"))));
  ans.el.hidden = !(d.actions.length || items.length || decs.length);
  root.append(HF.header(d, "Overview", "Do what is required from you first, tick what you have checked, then copy the answer block into the chat."),
    d.task ? h("p", { class: "task" }, h("b", null, "Task: "), HF.md(d.task)) : null, parts.length > 2 ? nav : null, ...parts, ans.el);
  let rw = window.innerWidth; window.addEventListener("resize", () => { if (window.innerWidth !== rw) { rw = window.innerWidth; redraw(); } });
  update(); redraw();
});
</script>
